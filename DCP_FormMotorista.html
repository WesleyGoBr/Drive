
<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      color: #202124;
      background: #f8f9fa;
    }

    h2 {
      margin-top: 0;
      color: #174ea6;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 13px;
    }

    input, textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 11px;
      border: 1px solid #dadce0;
      border-radius: 6px;
      font-size: 14px;
      background: white;
    }

    textarea {
      resize: vertical;
      min-height: 75px;
    }

    .obrigatorio {
      color: #d93025;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 22px;
      border: none;
      border-radius: 6px;
      background: #174ea6;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #9aa0a6;
      cursor: wait;
    }

    #mensagem {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      display: none;
      white-space: pre-wrap;
      font-size: 13px;
    }

    .sucesso {
      display: block !important;
      background: #e6f4ea;
      color: #137333;
    }

    .erro {
      display: block !important;
      background: #fce8e6;
      color: #c5221f;
    }

    .nota {
      color: #5f6368;
      font-size: 12px;
      margin-top: 14px;
    }
  </style>
</head>

<body>

  <h2>Novo motorista</h2>

  <form id="formMotorista">

    <label>
      Nome completo <span class="obrigatorio">*</span>
    </label>
    <input
      type="text"
      id="nomeCompleto"
      maxlength="150"
      required
      autocomplete="name"
    >

    <label>Nome de exibição</label>
    <input
      type="text"
      id="nomeExibicao"
      maxlength="80"
    >

    <label>Telefone</label>
    <input
      type="tel"
      id="telefone"
      placeholder="(00) 00000-0000"
    >

    <label>E-mail</label>
    <input
      type="email"
      id="email"
      autocomplete="email"
    >

    <label>Observações</label>
    <textarea
      id="observacoes"
      maxlength="2000"
    ></textarea>

    <button type="submit" id="btnSalvar">
      CADASTRAR MOTORISTA
    </button>

  </form>

  <div id="mensagem"></div>

  <p class="nota">
    O código, UUID e status serão gerados automaticamente
    pelo sistema. Campos com * são obrigatórios.
  </p>

  <script>
    const form = document.getElementById('formMotorista');
    const botao = document.getElementById('btnSalvar');
    const mensagem = document.getElementById('mensagem');

    form.addEventListener('submit', function(event) {
      event.preventDefault();

      if (!form.reportValidity()) return;

      const dados = {
        nomeCompleto:
          document.getElementById('nomeCompleto').value,

        nomeExibicao:
          document.getElementById('nomeExibicao').value,

        telefone:
          document.getElementById('telefone').value,

        email:
          document.getElementById('email').value,

        observacoes:
          document.getElementById('observacoes').value
      };

      botao.disabled = true;
      botao.textContent = 'PROCESSANDO...';

      mensagem.className = '';
      mensagem.style.display = 'none';

      google.script.run
        .withSuccessHandler(function(resultado) {

          botao.disabled = false;
          botao.textContent = 'CADASTRAR MOTORISTA';

          if (resultado && resultado.sucesso) {
            mensagem.textContent =
            (resultado.mensagem || 'Motorista cadastrado com sucesso.') +
            '\n\nCódigo: ' + resultado.codigoMotorista +
            '\nStatus: ' + resultado.status;

            mensagem.className = 'sucesso';

            form.reset();

          } else {
            mensagem.textContent =
              'Não foi possível confirmar o cadastro.';

            mensagem.className = 'erro';
          }
        })
        .withFailureHandler(function(erro) {

          botao.disabled = false;
          botao.textContent = 'CADASTRAR MOTORISTA';

          mensagem.textContent =
            'ERRO AO CADASTRAR:\n' + erro.message;

          mensagem.className = 'erro';

        })
        .DCP_CADASTRAR_MOTORISTA_22A(dados);
    });
  </script>

</body>
</html>
